services:
  - type: web
    name: alien
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ALIEN_GATEWAY_PORT
        value: "8080"
      - key: ALIEN_STATE_DIR
        value: /data/.alien
      - key: ALIEN_WORKSPACE_DIR
        value: /data/workspace
      - key: ALIEN_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: alien-data
      mountPath: /data
      sizeGB: 1
