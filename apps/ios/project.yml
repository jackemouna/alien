name: Alien
options:
  bundleIdPrefix: ai.alien
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  AlienKit:
    path: ../shared/AlienKit
  Swabble:
    path: ../swabble

schemes:
  Alien:
    shared: true
    build:
      targets:
        Alien: all
    test:
      targets:
        - AlienTests
        - AlienLogicTests
  AlienLogicTests:
    shared: true
    build:
      targets:
        AlienLogicTests: all
    test:
      targets:
        - AlienLogicTests

targets:
  Alien:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: AlienShareExtension
        embed: true
      - target: AlienActivityWidget
        embed: true
      - target: AlienWatchApp
      - package: AlienKit
      - package: AlienKit
        product: AlienChatUI
      - package: AlienKit
        product: AlienProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../config/swiftformat" \
            --unexclude "$SRCROOT/Sources,$SRCROOT/ShareExtension,$SRCROOT/ActivityWidget,$SRCROOT/WatchExtension,$SRCROOT/../shared/AlienKit,$SRCROOT/../swabble" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/Alien.entitlements
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALIEN_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALIEN_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          ALIEN_PUSH_TRANSPORT: direct
          ALIEN_PUSH_DISTRIBUTION: local
          ALIEN_PUSH_RELAY_BASE_URL: ""
          ALIEN_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          ALIEN_PUSH_TRANSPORT: direct
          ALIEN_PUSH_DISTRIBUTION: local
          ALIEN_PUSH_RELAY_BASE_URL: ""
          ALIEN_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Alien
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.alien.ios
            CFBundleURLSchemes:
              - alien
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        AlienCanonicalVersion: "$(ALIEN_IOS_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.alien.ios.bgrefresh
        NSLocalNetworkUsageDescription: Alien discovers and connects to your Alien gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _alien-gw._tcp
        NSCameraUsageDescription: Alien can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: Alien uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Alien can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: Alien needs microphone access for voice wake.
        NSMotionUsageDescription: Alien may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: Alien needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: Alien uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        AlienPushTransport: "$(ALIEN_PUSH_TRANSPORT)"
        AlienPushDistribution: "$(ALIEN_PUSH_DISTRIBUTION)"
        AlienPushRelayBaseURL: "$(ALIEN_PUSH_RELAY_BASE_URL)"
        AlienPushAPNsEnvironment: "$(ALIEN_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  AlienShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: AlienKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALIEN_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALIEN_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Alien Share
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  AlienActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/AlienActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALIEN_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Alien Activity
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AlienWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: AlienWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(ALIEN_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(ALIEN_CODE_SIGN_STYLE)"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALIEN_WATCH_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALIEN_WATCH_APP_PROFILE)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Alien
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(ALIEN_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  AlienWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    attributes:
      DevelopmentTeam: "$(ALIEN_DEVELOPMENT_TEAM)"
      ProvisioningStyle: "$(ALIEN_CODE_SIGN_STYLE)"
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(ALIEN_WATCH_EXTENSION_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(ALIEN_WATCH_EXTENSION_PROFILE)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: Alien
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(ALIEN_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  AlienTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: Alien
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.alien.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Alien.app/Alien"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AlienTests
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"

  AlienLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: AlienKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(ALIEN_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(ALIEN_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.alien.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_EMIT_CONST_VALUE_PROTOCOLS: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: AlienLogicTests
        CFBundleShortVersionString: "$(ALIEN_MARKETING_VERSION)"
        CFBundleVersion: "$(ALIEN_BUILD_VERSION)"
