name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so a fast-follow push doesn't
# pile up dead runs on busy branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core)
        run: pnpm tsgo:core

      - name: Unit tests (workforce surfaces)
        run: pnpm test src/projects src/orchestrator src/integrations src/templates

      - name: UI tests
        run: pnpm test ui/src/ui/navigation.test.ts ui/src/ui/theme.test.ts
